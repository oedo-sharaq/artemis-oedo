Anchor:
 - &input rawdata/asagipulse@NUM@.ridf
 - &output output/@NUM@/chkasagi_@NUM@.tree.root
 - &histout output/@NUM@/chkasagi_@NUM@.hist.root

Processor:
  - name: timer
    type: art::TTimerProcessor

  - name: ridf
    type: art::TRIDFEventStore
    parameter:
      OutputTransparency: 1
      InputFiles:
        - *input
        
  - name: mapper
    type: art::TMappingProcessor
    parameter:
      OutputTransparency: 1
      MapConfig: conf/mapper.conf

  - name: proc_gateinit
    type: art::TGateArrayInitializer
    parameter:
      OutputTransparency: 1

  - include: bld/srppac/srppacasagi.yaml
#  - include: bld/mwdc/chkmwdc_local.yaml

